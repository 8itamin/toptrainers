name: Workout Results RED diagnostic

on:
  push:
    branches: [feature/workout-results-v1]

permissions:
  contents: read

jobs:
  results-red:
    runs-on: ubuntu-latest
    env:
      TT_TEST_DATABASE_URL: postgresql+asyncpg://toptrainers_test:toptrainers_test@127.0.0.1:5432/toptrainers_test
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: toptrainers_test
          POSTGRES_USER: toptrainers_test
          POSTGRES_PASSWORD: toptrainers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toptrainers_test -d toptrainers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - name: Capture Results RED output
        run: |
          set +e
          pytest tests/test_workout_results_model_contract.py tests/test_workout_results_http_contract.py tests/test_workout_results_migration.py tests/test_workout_results_integration.py tests/test_workout_results_concurrency.py -q > /tmp/results-red.log 2>&1
          code=$?
          echo "pytest_exit_code=$code" >> /tmp/results-red.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: workout-results-red-log
          path: /tmp/results-red.log
