name: Results Diagnostic

on:
  push:
    branches: [feature/workout-results-v1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TT_TEST_DATABASE_URL: postgresql+asyncpg://toptrainers_test:toptrainers_test@127.0.0.1:5432/toptrainers_test
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: toptrainers_test
          POSTGRES_USER: toptrainers_test
          POSTGRES_PASSWORD: toptrainers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toptrainers_test -d toptrainers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q '.[dev]'
      - name: Model contract
        run: pytest -vv -x tests/test_workout_results_model_contract.py::test_results_table_uses_only_execution_and_frozen_coordinates_as_identity
      - name: First result PUT
        if: always()
        run: pytest -vv -x tests/test_workout_results_integration.py::test_duplicate_source_occurrences_are_independent_and_partial_values_work
