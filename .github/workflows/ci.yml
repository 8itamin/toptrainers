name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  backend-quality:
    name: Backend quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: mypy src

  backend-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TT_TEST_DATABASE_URL: postgresql+asyncpg://toptrainers_test:toptrainers_test@127.0.0.1:5432/toptrainers_test
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: toptrainers_test
          POSTGRES_USER: toptrainers_test
          POSTGRES_PASSWORD: toptrainers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toptrainers_test -d toptrainers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - name: Run backend tests including P0 concurrency suite
        run: pytest

  openapi-export-once:
    name: One-shot OpenAPI export
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python scripts/export_openapi.py
      - name: Commit generated OpenAPI to PR branch
        run: |
          git add -f openapi/openapi.json
          if git diff --cached --quiet -- openapi/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: export authoritative OpenAPI"
          git push origin HEAD:${{ github.head_ref }}
