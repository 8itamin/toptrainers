name: Publish Workout History P0 once

on:
  push:
    branches: [feature/workout-history-p0]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workout-history-p0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Apply reviewed local overlay
        run: |
          echo '' | base64 -d | tar -xz
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          python -m pip install '.[dev]'
      - name: Generate authoritative OpenAPI
        run: |
          cd backend
          python scripts/export_openapi.py
      - name: Update project memory once
        run: |
          marker='Workout History P0 read-side'
          if ! grep -Fq "$marker" DOC/PROJECT_MEMORY.md; then
            printf '\n> Workout History P0 read-side (2026-09-04): completed workout history is a read projection over Relationship + Assignment + Execution, with no persistent History entity. Client self-history and Trainer→target-client pair history include only COMPLETED assignments with non-null execution.completed_at, aggregate active/terminated and repeated relationships, use frozen assignment snapshot title, deterministic keyset pagination, and migration 20260904_0008 adds only the partial completion index.\n' >> DOC/PROJECT_MEMORY.md
          fi
      - name: Commit reviewed change-set
        run: |
          git add backend DOC/PROJECT_MEMORY.md
          git add -f backend/openapi/openapi.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add workout history P0 read-side'
          git push origin HEAD:feature/workout-history-p0
