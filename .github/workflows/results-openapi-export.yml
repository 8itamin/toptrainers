name: Results OpenAPI Export

on:
  push:
    branches: [feature/workout-results-v1]
    paths-ignore:
      - backend/openapi/openapi.json

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q '.[dev]'
      - run: python scripts/export_openapi.py
      - name: Commit authoritative OpenAPI
        run: |
          git add openapi/openapi.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh workout results OpenAPI"
          git push origin HEAD:feature/workout-results-v1
